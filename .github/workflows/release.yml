# ============================================================
#  打 tag 即发布
#
#  为什么用 Actions 而不是本机打包上传：
#    portable exe 约 100 MB，超过 GitHub 仓库的**单文件 100 MB 上限**，
#    所以它不能进仓库，只能作为 Release 附件 —— 而本机没有 gh CLI、
#    也没有 GITHUB_TOKEN，建不了 Release。
#    Actions 里的 GITHUB_TOKEN 是自动注入的，于是"打 tag → 出 Release"
#    完全不需要任何本地凭据，以后每次发版都是一条命令。
#
#  用法：
#    npm version 0.3.1 --no-git-tag-version   （或手改 package.json）
#    git commit -am "v0.3.1"
#    git tag v0.3.1 && git push origin main v0.3.1
#    → 几分钟后 https://github.com/Rhys443/CiJIan/releases/latest 就有新版
#
#  也可以在 Actions 页面手动 Run workflow（workflow_dispatch）。
# ============================================================
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # 建 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 用 ci 而不是 install：锁文件在仓库里，构建才可复现
      - name: 安装依赖
        run: npm ci

      # 关掉 electron-builder 的代码签名（没有证书，签名会让它去下载 winCodeSign）
      - name: 打包 portable exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 列出产物（排查用）
        run: dir dist
        shell: cmd

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
          name: 此间 ${{ github.ref_name }}
          body: |
            > **界面概念 Demo** · Windows 免安装 · 双击即用
            > 完整说明见 [README](https://github.com/Rhys443/CiJIan#readme)

            ### 下载

            | | |
            |---|---|
            | 文件 | `Cijian-*-portable.exe`（约 100 MB，单文件） |
            | 系统 | Windows 10 / 11 64 位 |
            | 安装 | 不需要，双击即用 |
            | 数据 | 全部保存在本机（`%APPDATA%\Cijian`），不联网、不上传 |

            ⚠️ 未做代码签名，SmartScreen 提示「未知发布者」时点「更多信息」→「仍要运行」。

            ---

            ### 更新日志 · 0.3.0 —— 玻璃材质与主题的探索

            这一版只做一件事：把**玻璃材质**与**主题系统**推进一步，其余功能保持原样。

            **玻璃**

            - **边缘剖面：四分之一圆 → smootherstep。** 圆角剖面的导数在边界处趋于无穷，
              等于表面以 90° 撞上边框 —— 那正是「玻璃砖接缝 / 有直角」的来源。
              smootherstep 两端一阶二阶导都为 0，表面以切线方向贴上去，全程没有折点。
            - **边缘明暗：边界上的台阶 → 贴边为 0 的鼓包。**
              原来轮廓处比面板外暗一档，边界两侧差一层亮度。这是**明暗**上的线，
              形状再顺滑也消不掉。
            - **表面倾角与折射厚度解耦**：`tanPhi = height/span × profileSlope(u)`。
            - **极光模式换材质**：没有底图时卡片去掉玻璃，改「微微透光 + 一点点高斯模糊」，
              侧栏保留玻璃当分界；有底图、暗房、空间三档不动。
            - **模糊程度交给用户**：设置 → 外观 → 强调色下面那根滑杆。
            - **跟手光按「剩余余量」给光**，极光底不再被夹断成纯白。

            **主题**

            - 理顺成一条链：底图决定背景并自带推荐强调色 → 强调色可手动覆盖（七色 + 自动）
              → 明暗只决定玻璃厚薄，不再决定颜色。周期主题不再改颜色。
            - 压暗层按外观分档：浅色极光 0.10、浅色底图 0.25、深色底图自适应 +0.10。

            **其他**

            - 左下角 TODAY 卡成了入口：按下缩小 → 松手弹出一整块日历（15 天范围、
              走到第几天、任务池），全程连续变形，关闭沿同一条路回卡片。
            - 修复：窗口左缘那条 10px 灰带（`.rail-edge::after` 的 `right` 被层叠挤掉，
              整条模糊带跑到了左缘）。
            - 修复：面板外文字自适应取色（新增 `js/adaptive.js`）。
            - 修复：极光模式整屏被固定压暗 30%。

